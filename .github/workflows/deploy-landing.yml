name: Deploy landing page

# Deploys landing/ to the Cloudflare Pages project `freeagent` (https://freeagent.cosmiclabs.org)
# whenever it changes on main. Secrets: CLOUDFLARE_API_TOKEN (Pages: Edit + Workers Scripts: Edit),
# CLOUDFLARE_ACCOUNT_ID. The GitHub OAuth secrets live on the Pages project, not here.

on:
  push:
    branches: [main]
    paths: ["landing/**", ".github/workflows/deploy-landing.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Cloudflare Pages
        working-directory: landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@latest pages deploy public --project-name freeagent --branch main --commit-dirty=true
