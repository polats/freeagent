<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>freeagent</title>
<meta name="description" content="Your coding agents on a box you own, from your phone.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#1a1b22">
<link rel="stylesheet" href="app.css?v=dev">
</head>
<body>
<header class="topbar">
  <div class="brand">freeagent</div>
  <button class="avatar" id="accounts-open" aria-label="Accounts" hidden><span id="avatar-initial"></span></button>
</header>

<main>
  <section id="signed-out" hidden>
    <div class="hero">
      <svg class="mark" width="56" height="56" viewBox="0 0 56 56" fill="none" aria-hidden="true"><circle cx="28" cy="28" r="20" stroke="currentColor" stroke-width="2"></circle><circle cx="28" cy="28" r="5" fill="currentColor"></circle><path d="M28 8V2M28 48v6" stroke="currentColor" stroke-width="2"></path></svg>
      <div class="wordmark">freeagent</div>
    </div>
    <div class="foot">
      <button class="filled" id="signin-github">Continue with GitHub</button>
      <p class="error" id="signed-out-error"></p>
    </div>
  </section>

  <section id="boxes-view" hidden>
    <p class="error" id="list-error"></p>
    <div class="grid">
      <div id="skeleton" class="contents" hidden><div class="tile skeleton"></div><div class="tile skeleton"></div><div class="tile skeleton"></div></div>
      <div id="cards" class="contents"></div>
      <button class="tile add" id="new-box" aria-label="New box"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M14 5v18M5 14h18" stroke="currentColor" stroke-width="2"></path></svg></button>
    </div>
  </section>
</main>

<!-- New box -->
<dialog class="sheet" id="create">
  <form method="dialog" id="create-form">
    <div class="handle"></div>
    <h2>New box</h2>
    <div class="seg" id="create-provider" role="radiogroup"></div>
    <button type="button" class="row" id="repo-picker"><span>Repository</span><span class="val"><span id="repo-picker-value">None</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.5"></path></svg></span></button>
    <label class="row"><span>Name</span><input id="create-name" autocomplete="off" spellcheck="false" maxlength="63" pattern="^[a-zA-Z0-9][a-zA-Z0-9-]{0,62}$"></label>
    <label class="row" id="machine-field"><span>Machine</span><select id="create-machine"><option value="basicLinux32gb">2 cores · 8 GB</option><option value="standardLinux32gb">4 cores · 16 GB</option></select></label>
    <label class="row" id="visibility-field" hidden><span>Visibility</span><select id="create-visibility"><option value="public">Public</option><option value="private">Private</option></select></label>
    <p class="error" id="create-error"></p>
    <div class="actions"><button type="button" class="text" id="create-cancel">Cancel</button><button type="submit" class="filled" id="create-submit">Create</button></div>
  </form>
  <div id="repo-search" hidden>
    <div class="handle"></div>
    <input id="repo-query" placeholder="Search repositories" autocomplete="off" spellcheck="false">
    <div class="list" id="repo-list"></div>
    <div class="actions"><button type="button" class="text" id="repo-cancel">Back</button></div>
  </div>
</dialog>

<!-- Accounts -->
<dialog class="sheet" id="accounts">
  <div class="handle"></div>
  <h2>Accounts</h2>
  <div class="acct" id="acct-github" hidden><div><div class="name" id="acct-github-sub"></div><div class="sub">GitHub</div></div><div class="slot"><button class="outlined" id="acct-github-connect" hidden>Connect</button><button class="text" id="signout" hidden>Sign out</button></div></div>
  <div class="acct" id="acct-hf" hidden><div><div class="name">Hugging Face</div><div class="sub" id="acct-hf-sub"></div></div><div class="slot"><button class="outlined" id="acct-hf-connect" hidden>Connect</button><button class="text" id="acct-hf-disconnect" hidden>Disconnect</button></div></div>
  <div class="acct" id="acct-railway" hidden><div><div class="name">Railway</div><div class="sub" id="acct-railway-sub"></div></div><div class="slot"><button class="outlined" id="acct-railway-connect" hidden>Connect</button><button class="text" id="acct-railway-disconnect" hidden>Disconnect</button></div></div>
  <div class="actions"><button class="text" id="accounts-close">Close</button></div>
</dialog>

<!-- Box actions -->
<dialog class="sheet" id="box-menu">
  <div class="handle"></div>
  <h2 id="box-menu-title"></h2>
  <div id="box-menu-items"></div>
  <div class="actions"><button class="text" id="box-menu-close">Close</button></div>
</dialog>

<!-- Delete -->
<dialog class="sheet" id="confirm">
  <div class="handle"></div>
  <h2>Delete this box?</h2>
  <p id="confirm-text"></p>
  <div class="actions"><button class="text" id="confirm-cancel">Cancel</button><button class="filled danger" id="confirm-ok">Delete</button></div>
</dialog>

<!-- Railway token -->
<dialog class="sheet" id="railway">
  <form method="dialog" id="railway-form">
    <div class="handle"></div>
    <h2>Connect Railway</h2>
    <a class="quiet left" href="https://railway.com/account/tokens" target="_blank" rel="noopener">railway.com/account/tokens</a>
    <label class="row"><span>Token</span><input id="railway-token" autocomplete="off" spellcheck="false" required></label>
    <p class="error" id="railway-error"></p>
    <div class="actions"><button type="button" class="text" id="railway-cancel">Cancel</button><button type="submit" class="filled" id="railway-submit">Connect</button></div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="config.js?v=dev"></script>
<script src="app.js?v=dev"></script>
</body>
</html>
