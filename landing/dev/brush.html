<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>brush harness</title>
<!-- Brush-only test page. Serve the landing/ folder (npx serve landing) and open /dev/brush.html; ?demo drives a synthetic swipe. dev/shot.mjs screenshots it in the installed Chrome. -->
<style>html,body{margin:0;height:100%;background:oklch(0.17 0.012 260);overflow:hidden}#trails{position:fixed;inset:0;width:100%;height:100%;touch-action:none}</style>
<canvas id="trails"></canvas>
<script type="module">
  import "../public/trails.js";
  const c = document.getElementById("trails");
  window.Trails.start(c);
  // ?demo drives a synthetic finger along an S-curve so a headless screenshot shows the brush
  if (location.search.includes("demo")) {
    const W = innerWidth, H = innerHeight; let t = 0;
    const fire = (type, x, y) => window.dispatchEvent(new PointerEvent(type, { clientX: x, clientY: y, pointerId: 1, pointerType: "touch", bubbles: true }));
    fire("pointerdown", W * 0.15, H * 0.75);
    const id = setInterval(() => {
      t += 1 / 60;
      const x = W * (0.15 + 0.7 * Math.min(1, t / 1.6)), y = H * (0.5 + 0.25 * Math.cos(t * 4));
      fire("pointermove", x, y);
      if (t > 1.6) clearInterval(id);
    }, 16);
  }
</script>
